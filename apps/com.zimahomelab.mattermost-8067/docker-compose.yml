# Generated from Apps/mattermost by scripts/make_variant.py — do not edit by hand.
# Identical to the base app, published on host port 8067.
# Configuration for big-bear-mattermost
name: big-bear-mattermost-8067

services:
  # Fixes ownership on the host bind mounts before Mattermost starts.
  # The Mattermost image runs as uid 2000 and cannot write to root-owned dirs,
  # which is the #1 cause of "works for me, crash-loops on a fresh install".
  #
  # It deliberately stays running after the chown: ZimaOS/CasaOS force
  # `restart: always` on every container in an app, so a helper that exits 0
  # gets restarted in a loop and never satisfies `service_completed_successfully`
  # — which leaves the main container stuck in `Created`. Idling + healthcheck
  # is the only ordering signal that survives that.
  mm-permissions:
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    container_name: big-bear-mattermost-permissions-8067
    user: "0:0"
    command: >-
      /bin/sh -c "mkdir -p /mm/config /mm/data /mm/logs /mm/plugins /mm/client-plugins
      && chown -R 2000:2000 /mm && exec tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "test -w /mm/config && test -w /mm/data && test -w /mm/logs"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    volumes:
      - /DATA/AppData/$AppID/config:/mm/config
      - /DATA/AppData/$AppID/data:/mm/data
      - /DATA/AppData/$AppID/logs:/mm/logs
      - /DATA/AppData/$AppID/plugins:/mm/plugins
      - /DATA/AppData/$AppID/client-plugins:/mm/client-plugins
    restart: unless-stopped
    networks:
      - big_bear_mattermost_8067_network

  database:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: big-bear-mattermost-database-8067
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: changeme-mattermost-db
      POSTGRES_DB: mattermost
    volumes:
      - /DATA/AppData/$AppID/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - big_bear_mattermost_8067_network

  mattermost:
    image: mattermost/mattermost-team-edition:release-12@sha256:be30cae64d57617b303fc97d398f3671f39424862c8bf71e95a0bf83dcd9711f
    container_name: big-bear-mattermost-8067
    depends_on:
      mm-permissions:
        condition: service_healthy
      database:
        condition: service_healthy
    ports:
      - 8067:8065
    volumes:
      - /DATA/AppData/$AppID/config:/mattermost/config
      - /DATA/AppData/$AppID/data:/mattermost/data
      - /DATA/AppData/$AppID/logs:/mattermost/logs
      - /DATA/AppData/$AppID/plugins:/mattermost/plugins
      - /DATA/AppData/$AppID/client-plugins:/mattermost/client/plugins
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:changeme-mattermost-db@database:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_FILESETTINGS_DIRECTORY: /mattermost/data
      # Leave Site URL unset: the first-run wizard asks for it, and it must match
      # whatever address the user opens (http://192.168.1.10:8065, a hostname, etc).
      # Setting it to the wrong value breaks websockets and push deep links.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    restart: unless-stopped
    networks:
      - big_bear_mattermost_8067_network

networks:
  big_bear_mattermost_8067_network:
    name: big_bear_mattermost_8067_network
    driver: bridge

x-casaos:
  main: mattermost
  index: /
  port_map: "8067"
  scheme: http
  id: com.zimahomelab.mattermost-8067
  icon: https://cdn.jsdelivr.net/gh/johanresen/zimaos-apps@gh-pages/apps/com.zimahomelab.mattermost-8067/assets/icon.svg
  version: "12.1.0"
  title:
    en_US: Mattermost (8067)
