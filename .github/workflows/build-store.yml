name: Build app store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dist/
        uses: IceWhaleTech/build-appstore-action@v1
        env:
          # Optional: raises Docker Hub rate limits during digest resolution
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          report-json: dist/build-report.json

      - name: Package CasaOS-compatible store.zip
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path(".")
          out = pathlib.Path("dist/store.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          skip = {"dist"}
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_dir():
                      continue
                  rel = p.relative_to(root).as_posix()
                  head = rel.split("/")[0]
                  if head in skip or rel == "store.zip":
                      continue
                  # keep .github/ (harmless, documents the build), drop other dotfiles/dirs
                  if head.startswith(".") and head != ".github":
                      continue
                  z.write(p, rel)
          print("store.zip entries:", zipfile.ZipFile(out).namelist())
          PY

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
